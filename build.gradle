plugins {
    id 'com.barrybecker4.bb4.scala-library' version '2.1-SNAPSHOT'
    id 'com.barrybecker4.bb4.publish' version '2.1-SNAPSHOT'
}

description = 'Generic Q-learning library with Tic-Tac-Toe, Frozen Lake, and Finger Chopsticks examples'
group = 'com.barrybecker4'
version = '2.1-SNAPSHOT'

bb4 {
    archivesBaseName.set('bb4-Q-learning')
    mainClass.set('com.barrybecker4.qlearning.ttt.TTTPlayer')
}

tasks.register('runTTT', JavaExec) {
    standardInput = System.in
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.barrybecker4.qlearning.ttt.TTTPlayer'
    group = 'application'
}

tasks.register('runFrozenLake', JavaExec) {
    standardInput = System.in
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.barrybecker4.qlearning.frozenlake.LakeSimulator'
    group = 'application'
}

tasks.register('runChopsticks', JavaExec) {
    standardInput = System.in
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.barrybecker4.qlearning.chopsticks.ChopsticksPlayer'
    group = 'application'
}

tasks.register('runTttMinimax', JavaExec) {
    standardInput = System.in
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.barrybecker4.qlearning.tttminimax.TicTacToe'
    group = 'application'
}
